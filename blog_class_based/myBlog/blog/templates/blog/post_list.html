{% extends "blog/base.html" %} {% block content %}
<h1>All Blog Post</h1>
<ul class="list-group">
  {% for post in posts %}
  <li class="list-group-item">
    <a href="{% url 'post_detail' post.pk %}"> {{post.title}} </a>
  </li>
  {% empty %}
  <li class="list-group-item">No Posts Available</li>
  {% endfor %}
</ul>

{% endblock %}
